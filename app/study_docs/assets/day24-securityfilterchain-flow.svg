<svg xmlns="http://www.w3.org/2000/svg" width="860" height="650" viewBox="0 0 860 650" font-family="system-ui, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect width="860" height="650" fill="#ffffff"/>
<defs>
<marker id="callHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
<marker id="retHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="none" stroke="#334155"/></marker>
<marker id="errHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="none" stroke="#b91c1c"/></marker>
</defs>
<text x="430" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">SecurityFilterChain — 인증 성공/실패 분기 (Day24)</text>
<rect x="30" y="34" width="140" height="30" fill="#ffffff" stroke="#334155"/>
<text x="100" y="53" text-anchor="middle" font-size="12" fill="#334155">Client</text>
<rect x="250" y="34" width="170" height="30" fill="#ffffff" stroke="#334155"/>
<text x="335" y="53" text-anchor="middle" font-size="12" fill="#334155">JwtAuthenticationFilter</text>
<rect x="480" y="34" width="210" height="30" fill="#ffffff" stroke="#334155"/>
<text x="585" y="47" text-anchor="middle" font-size="11" fill="#334155">AuthorizationFilter /</text>
<text x="585" y="59" text-anchor="middle" font-size="11" fill="#334155">ExceptionTranslationFilter</text>
<rect x="740" y="34" width="90" height="30" fill="#ffffff" stroke="#334155"/>
<text x="785" y="53" text-anchor="middle" font-size="12" fill="#334155">Controller</text>
<line x1="100" y1="64" x2="100" y2="615" stroke="#334155" stroke-dasharray="4,3"/>
<line x1="335" y1="64" x2="335" y2="615" stroke="#334155" stroke-dasharray="4,3"/>
<line x1="585" y1="64" x2="585" y2="615" stroke="#334155" stroke-dasharray="4,3"/>
<line x1="785" y1="64" x2="785" y2="615" stroke="#334155" stroke-dasharray="4,3"/>
<line x1="100" y1="95" x2="330" y2="95" stroke="#334155" marker-end="url(#callHead)"/>
<text x="105" y="90" font-size="10.5" fill="#334155">Authorization: Bearer &lt;token&gt; (없음/위조/만료 가능)</text>
<rect x="330" y="95" width="10" height="65" fill="#e5e7eb" stroke="#334155"/>
<path d="M340,115 C400,110 400,140 340,138" fill="none" stroke="#334155" marker-end="url(#callHead)"/>
<text x="405" y="112" font-size="10" fill="#334155">parseSubject() 성공 → SecurityContext.setAuthentication()</text>
<text x="405" y="126" font-size="10" fill="#334155">JwtException → SecurityContextHolder.clearContext()</text>
<line x1="340" y1="160" x2="580" y2="160" stroke="#334155" marker-end="url(#callHead)"/>
<text x="345" y="155" font-size="10.5" fill="#334155">filterChain.doFilter() — 인증 정보(또는 빈 컨텍스트) 전달</text>
<rect x="580" y="160" width="10" height="425" fill="#e5e7eb" stroke="#334155"/>
<rect x="30" y="185" width="800" height="410" fill="none" stroke="#334155"/>
<path d="M30,185 L88,185 L88,203 L74,211 L30,211 Z" fill="#ffffff" stroke="#334155"/>
<text x="40" y="202" font-size="11" font-weight="bold" fill="#334155">alt</text>
<text x="96" y="202" font-size="10.5" fill="#334155">[인증 성공 + hasRole 충족]</text>
<line x1="585" y1="230" x2="780" y2="230" stroke="#334155" marker-end="url(#callHead)"/>
<text x="600" y="225" font-size="10" fill="#334155">handle() 위임</text>
<line x1="780" y1="260" x2="105" y2="260" stroke="#334155" stroke-dasharray="4,3" marker-end="url(#retHead)"/>
<text x="120" y="255" font-size="10.5" fill="#334155">200 OK + 응답 본문</text>
<line x1="30" y1="300" x2="830" y2="300" stroke="#334155" stroke-dasharray="6,4"/>
<text x="40" y="316" font-size="10.5" fill="#334155">[인증 실패 — 토큰 없음 / 위조(서명 불일치) / 만료]</text>
<path d="M590,332 C650,327 650,352 590,350" fill="none" stroke="#b91c1c" marker-end="url(#errHead)"/>
<text x="655" y="330" font-size="9.5" fill="#334155">CustomAuthenticationEntryPoint</text>
<text x="655" y="343" font-size="9.5" fill="#334155">.commence()</text>
<line x1="580" y1="375" x2="105" y2="375" stroke="#b91c1c" stroke-dasharray="4,3" marker-end="url(#errHead)"/>
<text x="120" y="370" font-size="10.5" fill="#b91c1c">401 {"error":"인증이 필요합니다."}</text>
<line x1="30" y1="405" x2="830" y2="405" stroke="#334155" stroke-dasharray="6,4"/>
<text x="40" y="421" font-size="10.5" fill="#334155">[인증 성공, 역할 불일치 — POST /reservations/cancel/** + hasRole("ADMIN") 실패]</text>
<path d="M590,437 C650,432 650,457 590,455" fill="none" stroke="#b91c1c" marker-end="url(#errHead)"/>
<text x="655" y="435" font-size="9.5" fill="#334155">CustomAccessDeniedHandler</text>
<text x="655" y="448" font-size="9.5" fill="#334155">.handle()</text>
<line x1="580" y1="480" x2="105" y2="480" stroke="#b91c1c" stroke-dasharray="4,3" marker-end="url(#errHead)"/>
<text x="120" y="475" font-size="10.5" fill="#b91c1c">403 {"error":"권한이 없습니다."}</text>
<rect x="30" y="620" width="6" height="6" fill="#334155"/>
<text x="42" y="627" font-size="9.5" fill="#334155">실선+채운 화살표=호출, 점선+열린 화살표=반환, 빨간 선=인증/인가 실패 경로</text>
</svg>
