<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="860" height="600" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .frame { fill: none; stroke: #334155; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .txt { font-size: 11.5px; fill: #475569; }
      .result { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .resultHi { font-size: 12px; font-weight: 700; fill: #b91c1c; }
      .ftitle { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .pname { font-size: 12.5px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <text x="20" y="24" font-size="12" fill="#475569">시퀀스 다이어그램 — A-101(member 있음) + B-202(member 없음) 저장 후 목록 조회 (FetchJoinInnerVsLeftTest)</text>

  <!-- participants -->
  <rect x="25" y="38" width="90" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="70" y="63" class="pname" text-anchor="middle">테스트</text>

  <rect x="150" y="38" width="220" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="260" y="63" class="pname" text-anchor="middle">ReservationRepository</text>

  <rect x="690" y="38" width="100" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="740" y="63" class="pname" text-anchor="middle">DB</text>

  <!-- lifelines -->
  <line x1="70"  y1="78" x2="70"  y2="582" class="life"/>
  <line x1="260" y1="78" x2="260" y2="582" class="life"/>
  <line x1="740" y1="78" x2="740" y2="582" class="life"/>

  <!-- ===== Frame A: findAllWithMember() inner join fetch ===== -->
  <rect x="20" y="96" width="820" height="220" class="frame"/>
  <path d="M 20 96 L 300 96 L 300 110 L 288 122 L 20 122 z" class="tab"/>
  <text x="30" y="114" class="ftitle">findAllWithMember() — join fetch (inner)</text>

  <rect x="256" y="136" width="8" height="140" class="act"/>
  <line x1="70" y1="140" x2="254" y2="140" class="msg"/>
  <text x="165" y="134" class="code" text-anchor="middle">findAllWithMember()</text>

  <rect x="736" y="156" width="8" height="30" class="act"/>
  <line x1="264" y1="160" x2="734" y2="160" class="msg"/>
  <text x="600" y="154" class="code" text-anchor="middle">select … from reservation join member …</text>

  <line x1="736" y1="184" x2="266" y2="184" class="rtn"/>
  <text x="600" y="178" class="txt" text-anchor="middle">1행 (A-101만, member 컬럼 채움)</text>

  <line x1="256" y1="212" x2="72" y2="212" class="rtn"/>
  <text x="165" y="206" class="code" text-anchor="middle">List&lt;Reservation&gt; (size 1)</text>

  <text x="30" y="248" class="resultHi">B-202(member 없음)는 오른쪽에 짝이 없어 결과 자체에서 제외됨</text>
  <text x="30" y="268" class="txt">assertEquals(1, result.size()) · noneMatch("B-202") — 통과</text>
  <text x="30" y="296" class="txt">(대조군으로 유지 — NPlusOneTest가 "N+1 없음"만 확인하는 용도)</text>

  <!-- ===== Frame B: findAllWithMemberOrNull() left join fetch ===== -->
  <rect x="20" y="330" width="820" height="252" class="frame"/>
  <path d="M 20 330 L 320 330 L 320 344 L 308 356 L 20 356 z" class="tab"/>
  <text x="30" y="348" class="ftitle">findAllWithMemberOrNull() — left join fetch</text>

  <rect x="256" y="370" width="8" height="150" class="act"/>
  <line x1="70" y1="374" x2="254" y2="374" class="msg"/>
  <text x="165" y="368" class="code" text-anchor="middle">findAllWithMemberOrNull()</text>

  <rect x="736" y="390" width="8" height="30" class="act"/>
  <line x1="264" y1="394" x2="734" y2="394" class="msg"/>
  <text x="600" y="388" class="code" text-anchor="middle">select … from reservation left join member …</text>

  <line x1="736" y1="418" x2="266" y2="418" class="rtn"/>
  <text x="600" y="412" class="txt" text-anchor="middle">2행 (A-101 + B-202, member 컬럼 전부 NULL인 행 포함)</text>

  <line x1="256" y1="450" x2="72" y2="450" class="rtn"/>
  <text x="165" y="440" class="code" text-anchor="middle">List&lt;Reservation&gt; (size 2)</text>
  <text x="165" y="462" class="txt" text-anchor="middle">B-202.getMember() == null</text>

  <text x="30" y="500" class="result">B-202도 왼쪽(reservation) 행이라 그대로 남고, member 쪽만 비어 있다</text>
  <text x="30" y="520" class="txt">assertEquals(2, result.size()) · assertNull(found.getMember()) — 통과</text>
  <text x="30" y="548" class="txt">ReservationService.findAllSummaries()가 이 메서드를 사용 — memberName은 null로 응답</text>
</svg>
